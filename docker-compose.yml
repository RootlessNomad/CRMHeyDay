# HeyDay CRM — Docker Compose (desarrollo local)
# Para producción en EasyPanel, usar las plantillas de deployment/easypanel/.
#
# Servicios:
#   db      — PostgreSQL 16
#   redis   — Redis 7 (BullMQ + rate limit)
#   backend — Fastify API  (:3001)
#   worker  — Consumidor BullMQ (Playwright incluido)
#   frontend — Next.js     (:3000)

services:
  db:
    image: postgres:16-alpine
    container_name: heyday-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: heyday_crm
      POSTGRES_USER: heyday
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-heyday_dev}
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - '${DB_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U heyday -d heyday_crm']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - heyday

  redis:
    image: redis:7-alpine
    container_name: heyday-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --maxmemory-policy
      - allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - heyday

  backend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.backend
      target: dev
    container_name: heyday-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      API_PORT: 3001
      DATABASE_URL: postgresql://heyday:${POSTGRES_PASSWORD:-heyday_dev}@db:5432/heyday_crm?schema=public
      REDIS_URL: redis://redis:6379
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-14d}
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL_DEFAULT: ${CLAUDE_MODEL_DEFAULT:-claude-sonnet-4-6}
      CLAUDE_MODEL_FAST: ${CLAUDE_MODEL_FAST:-claude-haiku-4-5-20251001}
      CLAUDE_MODEL_PREMIUM: ${CLAUDE_MODEL_PREMIUM:-claude-opus-4-7}
      APP_URL: ${APP_URL:-http://localhost:3000}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-localhost}
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - '${API_PORT:-3001}:3001'
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - ./package.json:/app/package.json
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - backend_node_modules:/app/backend/node_modules
      - shared_node_modules:/app/shared/node_modules
      - root_node_modules:/app/node_modules
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:3001/health || exit 1']
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - heyday

  worker:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.worker
      target: dev
    container_name: heyday-worker
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DATABASE_URL: postgresql://heyday:${POSTGRES_PASSWORD:-heyday_dev}@db:5432/heyday_crm?schema=public
      REDIS_URL: redis://redis:6379
      CREDENTIAL_MASTER_KEY: ${CREDENTIAL_MASTER_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL_DEFAULT: ${CLAUDE_MODEL_DEFAULT:-claude-sonnet-4-6}
      CLAUDE_MODEL_FAST: ${CLAUDE_MODEL_FAST:-claude-haiku-4-5-20251001}
      CLAUDE_MODEL_PREMIUM: ${CLAUDE_MODEL_PREMIUM:-claude-opus-4-7}
      TZ: ${TZ:-Europe/Madrid}
      # Playwright
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - ./package.json:/app/package.json
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - worker_node_modules:/app/backend/node_modules
      - worker_shared_modules:/app/shared/node_modules
      - worker_root_modules:/app/node_modules
    networks:
      - heyday

  frontend:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.frontend
      target: dev
    container_name: heyday-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${APP_ENV:-development}
      WEB_PORT: 3000
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
      NEXT_PUBLIC_APP_NAME: HeyDay CRM
      TZ: ${TZ:-Europe/Madrid}
    ports:
      - '${WEB_PORT:-3000}:3000'
    depends_on:
      backend:
        condition: service_started
    volumes:
      - ./frontend:/app/frontend
      - ./shared:/app/shared
      - ./package.json:/app/package.json
      - ./pnpm-workspace.yaml:/app/pnpm-workspace.yaml
      - ./tsconfig.base.json:/app/tsconfig.base.json
      - frontend_node_modules:/app/frontend/node_modules
      - frontend_shared_modules:/app/shared/node_modules
      - frontend_root_modules:/app/node_modules
      - frontend_next_cache:/app/frontend/.next
    networks:
      - heyday

networks:
  heyday:
    driver: bridge

volumes:
  db_data:
  redis_data:
  backend_node_modules:
  shared_node_modules:
  root_node_modules:
  worker_node_modules:
  worker_shared_modules:
  worker_root_modules:
  frontend_node_modules:
  frontend_shared_modules:
  frontend_root_modules:
  frontend_next_cache:
